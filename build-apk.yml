name: Build APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk simulador-vida.apk
      - uses: actions/upload-artifact@v4
        with:
          name: simulador-vida-apk
          path: simulador-vida.apk
      - name: Publish release (latest)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Simulador de Vida (APK mais recente)
          files: simulador-vida.apk
      - name: Publish release (tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: simulador-vida.apk
