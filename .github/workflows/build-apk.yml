
name: Build APK

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build APK
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Prepare APK
        run: |
          mkdir -p output
          cp app/build/outputs/apk/debug/app-debug.apk output/simulador-vida.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: simulador-vida-apk
          path: output/simulador-vida.apk

      - name: Publish latest release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Simulador de Vida - APK mais recente
          files: output/simulador-vida.apk
          make_latest: true

      - name: Publish version release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: output/simul
          ador-vida.apk
