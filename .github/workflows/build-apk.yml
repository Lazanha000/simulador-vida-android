name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Descompactar projeto
        run: unzip -q simulador-vida-android.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Android SDK (já vem na imagem; só aceitar licenças)
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKM" ] || SDKM=$(ls $ANDROID_HOME/cmdline-tools/*/bin/sdkmanager | head -1)
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-34" "build-tools;34.0.0" || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Build debug APK
        working-directory: simulador-vida-android
        run: gradle --no-daemon assembleDebug
      - name: Renomear APK
        run: cp simulador-vida-android/app/build/outputs/apk/debug/app-debug.apk simulador-vida.apk
      - uses: actions/upload-artifact@v4
        with:
          name: simulador-vida-apk
          path: simulador-vida.apk
      - name: Publicar release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Simulador de Vida (APK mais recente)
          files: simulador-vida.apk
