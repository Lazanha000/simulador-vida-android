name: Build APK
 
on:
  push:
    branches: [main]
  workflow_dispatch:
 
permissions:
  contents: write
 
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
 
      # Acha o projeto sozinho: se houver um .zip com o projeto no repo, descompacta;
      # depois procura a pasta que tem o settings.gradle.kts (raiz ou subpasta).
      - name: Localizar projeto
        run: |
          set -e
          if [ ! -f settings.gradle.kts ] && [ ! -f settings.gradle ]; then
            ZIP=$(find . -maxdepth 2 -type f -iname "*.zip" -not -path "./.git/*" | head -1)
            if [ -n "$ZIP" ]; then
              echo "Descompactando $ZIP"
              unzip -q -o "$ZIP" -d _projeto
            fi
          fi
          SETTINGS=$(find . -maxdepth 4 \( -name settings.gradle.kts -o -name settings.gradle \) -not -path "./.git/*" | head -1)
          if [ -z "$SETTINGS" ]; then
            echo "::error::Projeto Android nao encontrado (settings.gradle.kts ausente). Arquivos no repo:"
            ls -la
            exit 1
          fi
          DIR=$(dirname "$SETTINGS")
          echo "PROJECT_DIR=$DIR" >> "$GITHUB_ENV"
          echo "Projeto em: $DIR"
 
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
 
      # Necessario para o plugin Chaquopy (Python no Android)
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
 
      - name: Android SDK (ja vem na imagem; so aceitar licencas)
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKM" ] || SDKM=$(ls $ANDROID_HOME/cmdline-tools/*/bin/sdkmanager | head -1)
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-34" "build-tools;34.0.0" || true
 
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
 
      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle --no-daemon assembleDebug
 
      - name: Renomear APK
        run: cp "$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk" simulador-vida.apk
 
      - uses: actions/upload-artifact@v4
        with:
          name: simulador-vida-apk
          path: simulador-vida.apk
 
      - name: Publicar release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Simulador de Vida (APK mais recente)
          files: simulador-vida.apk
 
